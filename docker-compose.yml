name: Orpbal

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.next
      args:
        NEXT_PUBLIC_SERVER_URL: http://localhost:8080
    env_file:
      - apps/web/.env
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: apps/server
      dockerfile: Dockerfile
    env_file:
      - apps/server/.env
    ports:
      - "8080:8080"
    environment:
      - CORS_ORIGIN=http://localhost:3001
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=app.db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

