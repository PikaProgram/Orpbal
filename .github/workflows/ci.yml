name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orpbal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: smoketest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Go modules
        working-directory: apps/server
        run: go mod download

      - name: Type check
        run: bun run check-types

      - name: Test web
        run: bun run test

      - name: Build web
        run: bun run build

      - name: Vet Go
        working-directory: apps/server
        run: go vet ./...

      - name: Test Go
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/orpbal_test?sslmode=disable
          MYSQL_SMOKE_DSN: mysql://root:test@tcp(127.0.0.1:3306)/smoketest?charset=utf8mb4
        run: go test ./...
