openapi: 3.0.3
info:
  title: Orpbal API
  version: 1.0.0
  description: |
    Database Management Platform API. Authenticated endpoints use the
    `orpbal_session` cookie; state-changing endpoints also require the
    per-session CSRF token in `X-CSRF-Token`.
servers:
  - url: /api
    description: Same-origin API exposed through the Astro proxy
security:
  - cookieAuth: []
tags:
  - name: system
  - name: auth
  - name: me
  - name: admin
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          headers:
            Set-Cookie:
              description: Opaque session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      responses:
        "200":
          description: Current session
          headers:
            Set-Cookie:
              description: Present when the session token was rotated
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other sessions revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/databases:
    get:
      operationId: listMyDatabases
      tags: [me]
      responses:
        "200":
          description: Enabled connections the user can reach
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyDatabase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      responses:
        "200":
          description: All platform users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createUser
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/users/{id}:
    get:
      operationId: getUser
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Platform user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateUser
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/users/{id}/password:
    post:
      operationId: resetUserPassword
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset and target sessions revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/groups:
    get:
      operationId: listGroups
      tags: [admin]
      responses:
        "200":
          description: All groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createGroup
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/groups/{id}:
    get:
      operationId: getGroup
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Group with members and grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateGroup
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteGroup
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Group, memberships and grants deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/groups/{id}/members/{userId}:
    put:
      operationId: addGroupMember
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Membership ensured
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeGroupMember
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Membership removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/databases:
    get:
      operationId: listDatabaseConnections
      tags: [admin]
      responses:
        "200":
          description: All managed database connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createDatabaseConnection
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
      responses:
        "201":
          description: Connection created and verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/databases/{id}:
    get:
      operationId: getDatabaseConnection
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Managed database connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateDatabaseConnection
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnectionRequest"
      responses:
        "200":
          description: Connection updated and verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/schema:
    get:
      operationId: getDatabaseSchema
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Tables grouped by schema with column counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/TargetError"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/query:
    post:
      operationId: executeDatabaseQuery
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteQueryRequest"
      responses:
        "200":
          description: Query result set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/TargetError"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/table-counts:
    get:
      operationId: listTableCounts
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Exact and estimated row counts per table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/TargetError"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/rows:
    post:
      operationId: mutateRows
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MutateRowsRequest"
      responses:
        "200":
          description: Mutation applied; returns the affected table's fresh rows is not provided, only the count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/TargetError"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/migrations/{migrationId}/diff:
    get:
      operationId: getMigrationDiff
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: migrationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Schema changes recorded for a successful migration; empty changes for pending or failed migrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationDiff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/migrations:
    get:
      operationId: listMigrations
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Linear migration history for the database
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Migration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createMigration
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMigrationRequest"
      responses:
        "201":
          description: Migration created and pending execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/migrations/{migrationId}/execute:
    post:
      operationId: executeMigration
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: migrationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Migration executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/TargetError"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/migrations/{migrationId}:
    patch:
      operationId: updateMigration
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: migrationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMigrationRequest"
      responses:
        "200":
          description: Pending migration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/grants:
    get:
      operationId: listGrants
      tags: [admin]
      parameters:
        - name: group_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: connection_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Database grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/groups/{id}/grants/{connectionId}:
    put:
      operationId: setGrant
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGrantRequest"
      responses:
        "204":
          description: Grant created or updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteGrant
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Grant removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: orpbal_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Per-session CSRF token from GET /auth/session
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, expired or revoked session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TargetError:
      description: Managed database target unreachable or returned an error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    AccessLevel:
      type: string
      enum: [view_only, view_edit]
    Engine:
      type: string
      enum: [postgres, mysql]
      description: Target DBMS engine; immutable once a connection is created.
    SSLMode:
      type: string
      enum: [disable, require, verify-ca, verify-full]
    User:
      type: object
      required: [id, username, is_platform_admin, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
        username:
          type: string
        is_platform_admin:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    Session:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        is_platform_admin:
          type: boolean
          default: false
    UpdateUserRequest:
      type: object
      properties:
        is_active:
          type: boolean
        is_platform_admin:
          type: boolean
    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          format: password
    Group:
      type: object
      required: [id, name, description, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GroupDetail:
      type: object
      required: [id, name, description, created_at, updated_at, members, grants]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/User"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    Grant:
      type: object
      required: [id, group_id, connection_id, access_level, created_at, updated_at]
      properties:
        id:
          type: integer
        group_id:
          type: integer
        connection_id:
          type: integer
        access_level:
          $ref: "#/components/schemas/AccessLevel"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SetGrantRequest:
      type: object
      required: [access_level]
      properties:
        access_level:
          $ref: "#/components/schemas/AccessLevel"
    DatabaseConnection:
      type: object
      required: [id, name, engine, host, port, database_name, username, ssl_mode, is_enabled, has_password, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        engine:
          $ref: "#/components/schemas/Engine"
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        username:
          type: string
        ssl_mode:
          $ref: "#/components/schemas/SSLMode"
        is_enabled:
          type: boolean
        has_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateConnectionRequest:
      type: object
      required: [name, engine, host, database_name, username]
      properties:
        name:
          type: string
        engine:
          $ref: "#/components/schemas/Engine"
        host:
          type: string
        port:
          type: integer
          default: 5432
          minimum: 1
          maximum: 65535
          description: Defaults to 5432 for postgres and 3306 for mysql.
        database_name:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
        ssl_mode:
          $ref: "#/components/schemas/SSLMode"
    UpdateConnectionRequest:
      type: object
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database_name:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
          description: Omit to keep the current password; send an empty string to clear it.
        ssl_mode:
          $ref: "#/components/schemas/SSLMode"
        is_enabled:
          type: boolean
    DatabaseSchema:
      type: object
      required: [schemas]
      properties:
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/SchemaTables"
    SchemaTables:
      type: object
      required: [schema, tables]
      properties:
        schema:
          type: string
        tables:
          type: array
          items:
            $ref: "#/components/schemas/SchemaTable"
    SchemaTable:
      type: object
      required: [name, columns]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SchemaColumn"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/SchemaConstraint"
        indexes:
          type: array
          items:
            $ref: "#/components/schemas/SchemaIndex"
    SchemaColumn:
      type: object
      required: [name, type, is_nullable, ordinal_position]
      properties:
        name:
          type: string
        type:
          type: string
        is_nullable:
          type: boolean
        ordinal_position:
          type: integer
        column_default:
          type: string
          nullable: true
        character_maximum_length:
          type: integer
          nullable: true
    SchemaConstraint:
      type: object
      required: [name, type, columns]
      properties:
        name:
          type: string
        type:
          type: string
          description: "PRIMARY KEY, FOREIGN KEY, UNIQUE, CHECK"
        columns:
          type: array
          items:
            type: string
        referenced_table:
          type: string
          nullable: true
        referenced_columns:
          type: array
          nullable: true
          items:
            type: string
    SchemaIndex:
      type: object
      required: [name, columns, is_unique]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            type: string
        is_unique:
          type: boolean
    ExecuteQueryRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          maxLength: 100000
        limit:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
    QueryResult:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            nullable: true
            description: Row values; null entries are SQL NULLs.
    Migration:
      type: object
      required: [id, connection_id, version, sql, executor_id, executor_username, status, executed_at]
      properties:
        id:
          type: integer
        connection_id:
          type: integer
        version:
          type: integer
        sql:
          type: string
        executor_id:
          type: integer
        executor_username:
          type: string
        status:
          type: string
          enum: [pending, success, failed]
        executed_at:
          type: string
          format: date-time
    TableCount:
      type: object
      required: [schema, table, columns, estimate]
      properties:
        schema:
          type: string
        table:
          type: string
        columns:
          type: integer
        estimate:
          type: integer
          nullable: true
          description: Estimated row count from pg_class.reltuples; null when the planner has no stats yet.
    MutateRowsRequest:
      type: object
      required: [schema, table, op]
      properties:
        schema:
          type: string
        table:
          type: string
        op:
          type: string
          enum: [insert, update, delete]
        values:
          type: object
          description: Column values for insert, or changed columns for update.
          additionalProperties: true
        pk:
          type: object
          description: Primary key column values identifying the target row; required for update and delete.
          additionalProperties: true
    MutationResult:
      type: object
      required: [affected]
      properties:
        affected:
          type: integer
    MigrationDiff:
      type: object
      required: [migration_id, status, changes]
      properties:
        migration_id:
          type: integer
        status:
          type: string
          enum: [pending, success, failed]
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SchemaChange"
    SchemaChange:
      type: object
      required: [kind, object_type, object_id, action]
      properties:
        kind:
          type: string
          description: Free-form grouping label shown in the UI (e.g. the schema name).
        object_type:
          type: string
          enum: [table, column, constraint, index]
        object_id:
          type: string
          description: Qualified object name, e.g. public.notes.body
        action:
          type: string
          enum: [added, removed, changed]
        detail:
          type: string
          description: Human-readable rendering of the change, e.g. "text NOT NULL → integer NULL".
    CreateMigrationRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          maxLength: 100000
    MyDatabase:
      type: object
      required: [connection_id, name, host, database_name, access_level]
      properties:
        connection_id:
          type: integer
        name:
          type: string
        host:
          type: string
        database_name:
          type: string
        access_level:
          $ref: "#/components/schemas/AccessLevel"
