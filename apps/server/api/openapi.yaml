openapi: 3.0.3
info:
  title: Orpbal API
  version: 1.0.0
  description: |
    Database Management Platform API. Authenticated endpoints use the
    `orpbal_session` cookie; state-changing endpoints also require the
    per-session CSRF token in `X-CSRF-Token`.
servers:
  - url: /api
    description: Same-origin API exposed through the Astro proxy
security:
  - cookieAuth: []
tags:
  - name: system
  - name: auth
  - name: me
  - name: admin
  - name: viewer
  - name: approvals
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          headers:
            Set-Cookie:
              description: Opaque session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      responses:
        "200":
          description: Current session
          headers:
            Set-Cookie:
              description: Present when the session token was rotated
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other sessions revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/databases:
    get:
      operationId: listMyDatabases
      tags: [me]
      responses:
        "200":
          description: Enabled connections the user can reach
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyDatabase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      responses:
        "200":
          description: All platform users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createUser
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/users/{id}:
    get:
      operationId: getUser
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Platform user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateUser
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/users/{id}/password:
    post:
      operationId: resetUserPassword
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset and target sessions revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/groups:
    get:
      operationId: listGroups
      tags: [admin]
      responses:
        "200":
          description: All groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createGroup
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/groups/{id}:
    get:
      operationId: getGroup
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Group with members and grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateGroup
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteGroup
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Group, memberships and grants deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/groups/{id}/members/{userId}:
    put:
      operationId: addGroupMember
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Membership ensured
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeGroupMember
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Membership removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/databases:
    get:
      operationId: listDatabaseConnections
      tags: [admin]
      responses:
        "200":
          description: All managed database connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createDatabaseConnection
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
      responses:
        "201":
          description: Connection created and verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/databases/{id}:
    get:
      operationId: getDatabaseConnection
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Managed database connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateDatabaseConnection
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnectionRequest"
      responses:
        "200":
          description: Connection updated and verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/schema:
    get:
      operationId: getDatabaseSchema
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Tables grouped by schema with column counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/TargetError"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/query:
    post:
      operationId: executeDatabaseQuery
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteQueryRequest"
      responses:
        "200":
          description: Query result set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/TargetError"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/explain:
    post:
      operationId: explainDatabaseQuery
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainQueryRequest"
      responses:
        "200":
          description: Execution plan for the statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplainResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/TargetError"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/table-counts:
    get:
      operationId: listTableCounts
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Exact and estimated row counts per table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/TargetError"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/rows:
    post:
      operationId: mutateRows
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MutateRowsRequest"
      responses:
        "200":
          description: Mutation applied; returns the affected table's fresh rows is not provided, only the count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/TargetError"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/migrations/{migrationId}/diff:
    get:
      operationId: getMigrationDiff
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: migrationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Schema changes recorded for the latest successful execution of this migration; empty changes otherwise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationDiff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/migrations:
    get:
      operationId: listMigrations
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: hide_rollback
          in: query
          required: false
          description: When true, hide execution pairs cancelled by a successful rollback (failed attempts remain visible)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Migration definitions with their full execution history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Migration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createMigration
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMigrationRequest"
      responses:
        "201":
          description: Migration draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/migrations/{migrationId}:
    patch:
      operationId: updateMigration
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: migrationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMigrationRequest"
      responses:
        "200":
          description: Draft migration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteMigration
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: migrationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Draft migration deleted; executions and history are kept
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/migrations/{migrationId}/submit:
    post:
      operationId: submitMigration
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: migrationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Submitted for review; approvals requested from every group leader with access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/migrations/{migrationId}/rollback:
    post:
      operationId: requestRollback
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: migrationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Rollback execution created and sent for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: Migration is irreversible or not the latest active migration
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/migrations/{migrationId}/forward:
    post:
      operationId: requestForward
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: migrationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Forward execution created and sent for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /databases/{id}/migrations/{migrationId}/revert-batches:
    post:
      operationId: requestBatchRevert
      tags: [viewer]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: migrationId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRevertRequest"
      responses:
        "202":
          description: Per-batch compensation execution created and sent for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /approvals:
    get:
      operationId: listMyApprovals
      tags: [approvals]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
      responses:
        "200":
          description: Approvals visible to the current user as a group leader
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /approvals/{approvalId}/approve:
    post:
      operationId: approveMigration
      tags: [approvals]
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Approval recorded; queued automatically when every required leader has approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /approvals/{approvalId}/reject:
    post:
      operationId: rejectMigration
      tags: [approvals]
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: Rejection recorded; migration returns to draft with the comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [viewer]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Job status including execution and batch progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      tags: [viewer]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Cancellation requested; batch jobs stop at the next batch boundary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/grants:
    get:
      operationId: listGrants
      tags: [admin]
      parameters:
        - name: group_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: connection_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Database grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/groups/{id}/grants/{connectionId}:
    put:
      operationId: setGrant
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGrantRequest"
      responses:
        "204":
          description: Grant created or updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteGrant
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Grant removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: orpbal_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Per-session CSRF token from GET /auth/session
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, expired or revoked session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TargetError:
      description: Managed database target unreachable or returned an error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    AccessLevel:
      type: string
      enum: [view_only, view_edit]
    Engine:
      type: string
      enum: [postgres, mysql]
      description: Target DBMS engine; immutable once a connection is created.
    SSLMode:
      type: string
      enum: [disable, require, verify-ca, verify-full]
    User:
      type: object
      required: [id, username, is_platform_admin, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
        username:
          type: string
        is_platform_admin:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    Session:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        is_platform_admin:
          type: boolean
          default: false
    UpdateUserRequest:
      type: object
      properties:
        is_active:
          type: boolean
        is_platform_admin:
          type: boolean
    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          format: password
    Group:
      type: object
      required: [id, name, description, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GroupDetail:
      type: object
      required: [id, name, description, created_at, updated_at, members, grants]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/User"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    Grant:
      type: object
      required: [id, group_id, connection_id, access_level, created_at, updated_at]
      properties:
        id:
          type: integer
        group_id:
          type: integer
        connection_id:
          type: integer
        access_level:
          $ref: "#/components/schemas/AccessLevel"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SetGrantRequest:
      type: object
      required: [access_level]
      properties:
        access_level:
          $ref: "#/components/schemas/AccessLevel"
    DatabaseConnection:
      type: object
      required: [id, name, engine, host, port, database_name, username, ssl_mode, is_enabled, has_password, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        engine:
          $ref: "#/components/schemas/Engine"
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        username:
          type: string
        ssl_mode:
          $ref: "#/components/schemas/SSLMode"
        is_enabled:
          type: boolean
        has_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateConnectionRequest:
      type: object
      required: [name, engine, host, database_name, username]
      properties:
        name:
          type: string
        engine:
          $ref: "#/components/schemas/Engine"
        host:
          type: string
        port:
          type: integer
          default: 5432
          minimum: 1
          maximum: 65535
          description: Defaults to 5432 for postgres and 3306 for mysql.
        database_name:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
        ssl_mode:
          $ref: "#/components/schemas/SSLMode"
    UpdateConnectionRequest:
      type: object
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database_name:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
          description: Omit to keep the current password; send an empty string to clear it.
        ssl_mode:
          $ref: "#/components/schemas/SSLMode"
        is_enabled:
          type: boolean
    DatabaseSchema:
      type: object
      required: [schemas]
      properties:
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/SchemaTables"
    SchemaTables:
      type: object
      required: [schema, tables]
      properties:
        schema:
          type: string
        tables:
          type: array
          items:
            $ref: "#/components/schemas/SchemaTable"
    SchemaTable:
      type: object
      required: [name, columns]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SchemaColumn"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/SchemaConstraint"
        indexes:
          type: array
          items:
            $ref: "#/components/schemas/SchemaIndex"
    SchemaColumn:
      type: object
      required: [name, type, is_nullable, ordinal_position]
      properties:
        name:
          type: string
        type:
          type: string
        is_nullable:
          type: boolean
        ordinal_position:
          type: integer
        column_default:
          type: string
          nullable: true
        character_maximum_length:
          type: integer
          nullable: true
    SchemaConstraint:
      type: object
      required: [name, type, columns]
      properties:
        name:
          type: string
        type:
          type: string
          description: "PRIMARY KEY, FOREIGN KEY, UNIQUE, CHECK"
        columns:
          type: array
          items:
            type: string
        referenced_table:
          type: string
          nullable: true
        referenced_columns:
          type: array
          nullable: true
          items:
            type: string
    SchemaIndex:
      type: object
      required: [name, columns, is_unique]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            type: string
        is_unique:
          type: boolean
    ExecuteQueryRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          maxLength: 100000
        limit:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
    ExplainQueryRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          maxLength: 100000
        analyze:
          type: boolean
          default: false
          description: Run EXPLAIN ANALYZE. Executes inside a read-only transaction and discards the results.
    ExplainResult:
      type: object
      required: [engine, analyze, nodes]
      properties:
        engine:
          $ref: "#/components/schemas/Engine"
        analyze:
          type: boolean
        nodes:
          type: array
          description: PostgreSQL plan tree; empty for MySQL, whose EXPLAIN output is tabular.
          items:
            $ref: "#/components/schemas/ExplainNode"
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            nullable: true
    ExplainNode:
      type: object
      required: [node_type, startup_cost, total_cost, plan_rows, plan_width]
      properties:
        node_type:
          type: string
          description: Scan or join strategy, e.g. Seq Scan, Index Scan, Nested Loop.
        relation:
          type: string
          nullable: true
        alias:
          type: string
          nullable: true
        index:
          type: string
          nullable: true
        join_type:
          type: string
          nullable: true
        scan_direction:
          type: string
          nullable: true
        filter:
          type: string
          nullable: true
        index_cond:
          type: string
          nullable: true
        sort_key:
          type: array
          nullable: true
          items:
            type: string
        startup_cost:
          type: number
          format: double
        total_cost:
          type: number
          format: double
        plan_rows:
          type: integer
        plan_width:
          type: integer
        actual_startup_time:
          type: number
          format: double
          nullable: true
        actual_total_time:
          type: number
          format: double
          nullable: true
        actual_rows:
          type: integer
          nullable: true
        actual_loops:
          type: integer
          nullable: true
        children:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ExplainNode"
    QueryResult:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            nullable: true
            description: Row values; null entries are SQL NULLs.
    TableCount:
      type: object
      required: [schema, table, columns, estimate]
      properties:
        schema:
          type: string
        table:
          type: string
        columns:
          type: integer
        estimate:
          type: integer
          nullable: true
          description: Estimated row count from pg_class.reltuples; null when the planner has no stats yet.
    MutateRowsRequest:
      type: object
      required: [schema, table, op]
      properties:
        schema:
          type: string
        table:
          type: string
        op:
          type: string
          enum: [insert, update, delete]
        values:
          type: object
          description: Column values for insert, or changed columns for update.
          additionalProperties: true
        pk:
          type: object
          description: Primary key column values identifying the target row; required for update and delete.
          additionalProperties: true
    MutationResult:
      type: object
      required: [affected]
      properties:
        affected:
          type: integer
    MigrationDiff:
      type: object
      required: [migration_id, status, changes]
      properties:
        migration_id:
          type: integer
        status:
          type: string
          enum: [pending, success, failed]
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SchemaChange"
    SchemaChange:
      type: object
      required: [kind, object_type, object_id, action]
      properties:
        kind:
          type: string
          description: Free-form grouping label shown in the UI (e.g. the schema name).
        object_type:
          type: string
          enum: [table, column, constraint, index]
        object_id:
          type: string
          description: Qualified object name, e.g. public.notes.body
        action:
          type: string
          enum: [added, removed, changed]
        detail:
          type: string
          maxLength: 100000
          description: Human-readable rendering of the change, e.g. "text NOT NULL → integer NULL".
    MigrationStatus:
      type: string
      enum: [draft, pending_review, approved, queued, running, success, failed, partial, cancelled]
    ExecutionKind:
      type: string
      enum: [up, rollback, forward, retry, batch_revert]
    CreateMigrationRequest:
      type: object
      required: [sql_up]
      properties:
        sql_up:
          type: string
          maxLength: 100000
        sql_down:
          type: string
          maxLength: 100000
          description: Reverse SQL enabling rollback; omit or leave empty when irreversible
        irreversible:
          type: boolean
          default: false
        irreversible_reason:
          type: string
          description: Required when irreversible is true
        batch:
          $ref: "#/components/schemas/BatchConfig"
    BatchConfig:
      type: object
      required: [batch_size, cursor_column, template]
      properties:
        batch_size:
          type: integer
          minimum: 1
          maximum: 1000000
        cursor_column:
          type: string
          description: Unique, unchanging column the worker advances each batch, e.g. id
        batch_table:
          type: string
          description: Table the batch cursor walks (identifier-validated), e.g. orpbal_demo_events
        min_id:
          type: integer
          format: int64
          description: Inclusive lower scope of the data migration
        max_id:
          type: integer
          format: int64
          description: Inclusive upper scope of the data migration
        template:
          type: string
          maxLength: 100000
          description: |
            Batch SQL with {{last_id}} (exclusive lower cursor bound), {{upper_id}} (inclusive upper bound the worker
            probes per batch), {{batch_size}}, {{min_id}}, {{max_id}} placeholders. Must be idempotent; scope rows with
            a subselect, e.g. UPDATE t SET ... WHERE id IN (SELECT id FROM t WHERE id > {{last_id}} AND id <= {{upper_id}}
            AND id >= {{min_id}} AND id <= {{max_id}} ORDER BY id LIMIT {{batch_size}}).
    BatchRevertRequest:
      type: object
      required: [execution_id, sql_down, batch_size, cursor_column]
      properties:
        execution_id:
          type: integer
          description: The partial batch execution to compensate
        sql_down:
          type: string
          maxLength: 100000
          description: Immutable compensation SQL with {{last_id}}, {{batch_size}}, {{min_id}}, {{max_id}} placeholders
        batch_size:
          type: integer
          minimum: 1
        cursor_column:
          type: string
        template:
          type: string
          description: Fallback when compensation SQL needs extra data recovery columns
    Execution:
      type: object
      required: [id, migration_id, connection_id, kind, status, actor_id, actor_username, created_at]
      properties:
        id:
          type: integer
        migration_id:
          type: integer
        connection_id:
          type: integer
        kind:
          $ref: "#/components/schemas/ExecutionKind"
        status:
          $ref: "#/components/schemas/MigrationStatus"
        actor_id:
          type: integer
        actor_username:
          type: string
        sql_executed:
          type: string
          description: Copy of the SQL that actually ran, filled after execution
        error:
          type: string
          nullable: true
        reverted_execution_id:
          type: integer
          nullable: true
          description: For rollback, the execution ID being cancelled
        batch_cursor:
          type: integer
          format: int64
          nullable: true
          description: Last committed batch upper bound (exclusive) for batch migrations
        batches_done:
          type: integer
        rows_done:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/SchemaSnapshotInfo"
    SchemaSnapshotInfo:
      type: object
      required: [phase]
      properties:
        phase:
          type: string
          enum: [before, after]
        captured_at:
          type: string
          format: date-time
    Migration:
      type: object
      required: [id, connection_id, version, sql_up, sql_down, irreversible, irreversible_reason, status, author_id, author_username, created_at, updated_at, executions, approvals]
      properties:
        id:
          type: integer
        connection_id:
          type: integer
        version:
          type: integer
        sql_up:
          type: string
        sql_down:
          type: string
          nullable: true
        irreversible:
          type: boolean
        irreversible_reason:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/MigrationStatus"
        author_id:
          type: integer
        author_username:
          type: string
        batch:
          $ref: "#/components/schemas/BatchConfig"
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        executions:
          type: array
          items:
            $ref: "#/components/schemas/Execution"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    ApprovalMigrationSummary:
      type: object
      required: [id, version, sql_up, status, author_username]
      properties:
        id:
          type: integer
        version:
          type: integer
        sql_up:
          type: string
        status:
          $ref: "#/components/schemas/MigrationStatus"
        author_username:
          type: string
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected]
    Approval:
      type: object
      required: [id, migration_id, group_id, group_name, leader_id, leader_username, status, created_at]
      properties:
        id:
          type: integer
        migration_id:
          type: integer
        migration:
          $ref: "#/components/schemas/ApprovalMigrationSummary"
        group_id:
          type: integer
        group_name:
          type: string
        leader_id:
          type: integer
        leader_username:
          type: string
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        decided_by_id:
          type: integer
          nullable: true
          description: Actual leader who approved; may differ from leader_id when leadership rotated
        decided_at:
          type: string
          format: date-time
          nullable: true
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    RejectRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 2000
          description: Reason returned to the migration author
    JobStatus:
      type: string
      enum: [queued, running, success, failed, cancelled, cancelling, partial]
    Job:
      type: object
      required: [id, execution_id, migration_id, connection_id, status, created_at]
      properties:
        id:
          type: integer
        execution_id:
          type: integer
        migration_id:
          type: integer
        connection_id:
          type: integer
        status:
          $ref: "#/components/schemas/JobStatus"
        attempts:
          type: integer
        batch_cursor:
          type: integer
          format: int64
          nullable: true
        batches_done:
          type: integer
        rows_done:
          type: integer
          format: int64
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    MyDatabase:
      type: object
      required: [connection_id, name, host, database_name, access_level]
      properties:
        connection_id:
          type: integer
        name:
          type: string
        host:
          type: string
        database_name:
          type: string
        access_level:
          $ref: "#/components/schemas/AccessLevel"
