# Disposable Postgres used by Go integration tests (TEST_DATABASE_URL).
# Start: docker compose -f docker-compose.test.yml up -d
# Stop/clean: docker compose -f docker-compose.test.yml down -v
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 1s
      timeout: 3s
      retries: 30
