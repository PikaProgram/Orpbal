global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: orpbal-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]

  - job_name: orpbal-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
